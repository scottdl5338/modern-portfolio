<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="38%" r="75%">
      <stop offset="0%" stop-color="#1a2329" />
      <stop offset="100%" stop-color="#0f1418" />
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#20b2a6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#20b2a6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- outfield arcs -->
  <path d="M 70,400 A 400,400 0 0 1 730,400" fill="none" stroke="#242b32" stroke-width="2" />
  <path d="M 150,400 A 320,320 0 0 1 650,400" fill="none" stroke="#242b32" stroke-width="2" />

  <!-- infield dirt -->
  <polygon points="400,400 560,260 400,140 240,260" fill="#1a2329" stroke="none" />

  <!-- basepaths -->
  <polyline points="400,400 560,260 400,140 240,260 400,400" fill="none" stroke="#20b2a6" stroke-width="3" />

  <!-- graph route overlay -->
  <line x1="400" y1="400" x2="400" y2="140" stroke="#f5a623" stroke-width="2" stroke-dasharray="6 6" opacity="0.6" />
  <line x1="560" y1="260" x2="240" y2="260" stroke="#f5a623" stroke-width="2" stroke-dasharray="6 6" opacity="0.4" />

  <!-- base nodes -->
  <g>
    <circle cx="400" cy="400" r="28" fill="url(#nodeGlow)" />
    <circle cx="400" cy="400" r="8" fill="#f0f2f5" />
    <circle cx="560" cy="260" r="24" fill="url(#nodeGlow)" />
    <circle cx="560" cy="260" r="7" fill="#f0f2f5" />
    <circle cx="400" cy="140" r="24" fill="url(#nodeGlow)" />
    <circle cx="400" cy="140" r="7" fill="#f0f2f5" />
    <circle cx="240" cy="260" r="24" fill="url(#nodeGlow)" />
    <circle cx="240" cy="260" r="7" fill="#f0f2f5" />
  </g>

  <!-- baseball -->
  <g transform="translate(660,95)">
    <circle r="26" fill="#f0f2f5" />
    <path d="M -15,-19 Q 0,0 -15,19" fill="none" stroke="#20b2a6" stroke-width="2" />
    <path d="M 15,-19 Q 0,0 15,19" fill="none" stroke="#20b2a6" stroke-width="2" />
  </g>

  <!-- stitches decorative -->
  <g stroke="#7a8491" stroke-width="1.5" opacity="0.5">
    <line x1="642" y1="80" x2="648" y2="86" />
    <line x1="647" y1="72" x2="653" y2="78" />
    <line x1="672" y1="108" x2="678" y2="114" />
    <line x1="677" y1="116" x2="683" y2="122" />
  </g>
</svg>
