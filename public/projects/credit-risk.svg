<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#20b2a6" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#20b2a6" stop-opacity="0.85" />
    </linearGradient>
    <radialGradient id="bgGrad2" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141a1f" />
      <stop offset="100%" stop-color="#0f1418" />
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)" />

  <!-- grid -->
  <g stroke="#242b32" stroke-width="1">
    <line x1="60" y1="80" x2="60" y2="400" />
    <line x1="60" y1="400" x2="760" y2="400" />
    <line x1="60" y1="320" x2="760" y2="320" stroke-dasharray="4 6" />
    <line x1="60" y1="240" x2="760" y2="240" stroke-dasharray="4 6" />
    <line x1="60" y1="160" x2="760" y2="160" stroke-dasharray="4 6" />
  </g>

  <!-- risk threshold -->
  <line x1="60" y1="205" x2="760" y2="205" stroke="#f5a623" stroke-width="2" stroke-dasharray="8 6" opacity="0.75" />

  <!-- bars -->
  <g>
    <rect x="100" y="310" width="50" height="90" rx="4" fill="url(#barGrad)" />
    <rect x="190" y="260" width="50" height="140" rx="4" fill="url(#barGrad)" />
    <rect x="280" y="290" width="50" height="110" rx="4" fill="url(#barGrad)" />
    <rect x="370" y="210" width="50" height="190" rx="4" fill="url(#barGrad)" />
    <rect x="460" y="250" width="50" height="150" rx="4" fill="url(#barGrad)" />
    <rect x="550" y="170" width="50" height="230" rx="4" fill="url(#barGrad)" />
    <rect x="640" y="230" width="50" height="170" rx="4" fill="url(#barGrad)" />
  </g>

  <!-- trend line -->
  <polyline points="125,300 215,250 305,280 395,200 485,240 575,160 665,220"
    fill="none" stroke="#f0f2f5" stroke-width="2" opacity="0.85" />
  <g fill="#20b2a6">
    <circle cx="125" cy="300" r="4" />
    <circle cx="215" cy="250" r="4" />
    <circle cx="305" cy="280" r="4" />
    <circle cx="395" cy="200" r="4" />
    <circle cx="485" cy="240" r="4" />
    <circle cx="575" cy="160" r="4" />
    <circle cx="665" cy="220" r="4" />
  </g>

  <!-- risk gauge -->
  <g transform="translate(690,90)">
    <path d="M -50,0 A 50,50 0 0 1 50,0" fill="none" stroke="#242b32" stroke-width="10" />
    <path d="M -50,0 A 50,50 0 0 1 20,-46" fill="none" stroke="#20b2a6" stroke-width="10" />
    <path d="M 20,-46 A 50,50 0 0 1 50,0" fill="none" stroke="#f5a623" stroke-width="10" />
    <line x1="0" y1="0" x2="12" y2="-43" stroke="#f0f2f5" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#f0f2f5" />
  </g>
</svg>
